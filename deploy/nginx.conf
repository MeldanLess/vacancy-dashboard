# nginx перед дашбордом.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vacancy-dashboard
#   sudo ln -s /etc/nginx/sites-available/vacancy-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS терминируется здесь: certbot кладёт сертификат в /etc/letsencrypt/, а
# этот файл переписывается так, чтобы всё шло на HTTPS.

# Streamlit перерисовывает страницу по WebSocket: соединение надо переключить
# с HTTP на WebSocket, а для этого заголовки Upgrade и Connection должны
# доехать до бэкенда. Карта живёт в контексте http — файл из sites-enabled
# включается именно туда.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vacancy_dashboard {
    server 127.0.0.1:8501;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.your-domain.com;

    # Проверка ACME от certbot должна остаться на обычном HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.your-domain.com;

    # Этими файлами управляет certbot; `certbot --nginx` переписывает пути
    # на месте.
    ssl_certificate     /etc/letsencrypt/live/dashboard.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://vacancy_dashboard;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Переключение на WebSocket — без него страница перестаёт
        # обновляться после первой загрузки.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Поток ответов Streamlit не буферизуется: буферизация задерживает
        # отрисовку на секунды.
        proxy_buffering off;

        # Долгоживущее соединение WebSocket должно жить дольше стандартного
        # таймаута в 60 секунд, иначе соединение рвётся и клиент переподключается.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
