name: Публикация образа

# Собирает образ контейнера и отправляет его в GitHub Container Registry, когда
# отправлен тег с версией. Именно тег тянет сервер, поэтому релиз — это
# `git tag` и пуш: та же дисциплина релизов, что и у тега `v1.0.0`, который
# требуют соглашения портфолио.
#
# Тесты выполняются первыми, в той же задаче: образ, не прошедший собственный
# набор тестов, в реестр не попадает.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Тесты, сборка и отправка
    runs-on: ubuntu-latest

    steps:
      - name: Готовим имя образа
        id: image
        # Путь в реестре контейнеров обязан быть строчным, а `github.repository`
        # сохраняет регистр владельца (`MeldanLess/vacancy-dashboard`). Без
        # приведения к нижнему регистру сборка падает с «repository name must
        # be lowercase».
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Готовим Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Ставим зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Проверяем стиль
        run: |
          ruff check .
          ruff format --check .

      - name: Запускаем тесты
        run: pytest --cov=vacancy_dashboard --cov-report=term-missing

      - name: Входим в реестр контейнеров
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собираем и отправляем образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
