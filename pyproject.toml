[project]
name = "vacancy-dashboard"
version = "0.1.0"
description = "Дашборд по российскому рынку IT-вакансий на данных API hh.ru."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Мелека Данила" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vacancy_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["vacancy_dashboard", "tests"]

[tool.ruff.lint]
select = [
    "E",   # ошибки pycodestyle
    "W",   # предупреждения pycodestyle
    "F",   # pyflakes
    "I",   # порядок импортов
    "B",   # flake8-bugbear
    "C4",  # генераторные выражения
    "UP",  # pyupgrade
    "SIM", # упрощение
    "ARG", # неиспользуемые аргументы
]
ignore = [
    # `*args`/`**kwargs` в нескольких помощниках используются намеренно.
    "ARG001",
]

[tool.ruff.lint.isort]
# `vacancy_dashboard` — собственный пакет проекта. Без этой строки ruff
# считает его сторонней библиотекой и требует переставить импорты в
# неправильном порядке.
known-first-party = ["vacancy_dashboard"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["vacancy_dashboard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Точка входа как скрипт: её запускает человек из терминала, а не тесты.
    'if __name__ == "__main__":',
]
